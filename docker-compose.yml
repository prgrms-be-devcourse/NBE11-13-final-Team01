services:
  mysql:
    image: mysql:8.4
    container_name: zipick-mysql
    environment:
      MYSQL_DATABASE: zipick
      MYSQL_USER: zipick
      MYSQL_PASSWORD: ${DB_PASSWORD:-zipick1234}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zipick-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
