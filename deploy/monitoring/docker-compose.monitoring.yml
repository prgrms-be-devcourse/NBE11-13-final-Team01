name: zipick-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${PROMETHEUS_TARGETS_FILE:?Set PROMETHEUS_TARGETS_FILE}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    mem_limit: 400m

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager']
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:?Set ALERTMANAGER_CONFIG_FILE}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    mem_limit: 96m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    network_mode: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${MONITOR_PRIVATE_IP:?Set MONITOR_PRIVATE_IP}:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 96m

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?Set GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    ports:
      - '${MONITOR_PRIVATE_IP:?Set MONITOR_PRIVATE_IP}:3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 200m

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
