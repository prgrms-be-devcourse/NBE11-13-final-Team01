global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.yml']
  - job_name: backend
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ['/etc/prometheus/targets/backend.yml']
  - job_name: cadvisor
    file_sd_configs:
      - files: ['/etc/prometheus/targets/cadvisor.yml']
  - job_name: postgres
    file_sd_configs:
      - files: ['/etc/prometheus/targets/postgres.yml']
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params: {family: [queue_coarse_metrics, queue_consumer_count]}
    file_sd_configs:
      - files: ['/etc/prometheus/targets/rabbitmq.yml']
  - job_name: service-probe
    metrics_path: /probe
    params: {module: [internal_http]}
    file_sd_configs:
      - files: ['/etc/prometheus/targets/services.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe_module]
        regex: (.+)
        target_label: __param_module
      - source_labels: [probe_target]
        target_label: __param_target
      - source_labels: [probe_target]
        target_label: instance
  # 대표 지도 API는 데이터베이스 조회를 수행하므로 5분마다 확인한다.
  - job_name: map-api-probe
    scrape_interval: 5m
    metrics_path: /probe
    params: {module: [internal_http]}
    file_sd_configs:
      - files: ['/etc/prometheus/targets/api.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [probe_target]
        target_label: __param_target
      - source_labels: [probe_target]
        target_label: instance
