# 운영 배포: 앱 EC2 에 rabbitmq + backend(메인) + notification(알림센터) + web(Caddy: 프론트 정적 파일 + /api 프록시)
# DB 는 프라이빗 서브넷의 별도 EC2(zipick-db, deploy/db-server/)에 있고, .env 의 DB_HOST 로 가리킨다.
# DB_HOST 를 비우면 예전처럼 이 파일의 db 컨테이너를 쓴다 (첫 설치·롤백용으로 서비스 정의는 남겨 둔다).
# 알림센터·RabbitMQ 는 바깥에 열지 않는다. backend 는 알림 요청을 rabbitmq 에 던지고, 테스트 발송·내역·묶음은 http://notification:8081 로 부른다.
# 알림센터는 판단 없이 보내기만 한다(스펙: docs/notification-api.md). 알림 설정은 메인 DB 에 있다.
# 비밀 값은 같은 폴더의 .env 에서 읽는다 (.env.prod.example 참고, git 에 올리지 않음).
# 외부에는 web 의 80/443 만 열린다. backend 는 컨테이너 네트워크 안에서만, DB 서버는 앱 서버 보안 그룹에서만 접근할 수 있다.
# 프로젝트 이름을 고정한다. 서버 기존 배포(~/zipick 에서 실행 → 디렉터리명 기반 'zipick')와 같은 볼륨(zipick_db-data 등)에 붙기 위해서다.
# 이름이 달라지면 빈 볼륨이 새로 생겨 DB 가 비어 보인다.
name: zipick

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zipick
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 필요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
      # 빈 볼륨으로 처음 뜰 때만 이름 순서대로 실행된다 (이후 재시작에는 실행되지 않음)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d zipick"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    # 알림 요청 큐. 관리 화면 플러그인 없는 이미지(메모리 절약). 외부 포트 없음
    image: rabbitmq:4.1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER 필요}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}
      # 메모리 상한: 컨테이너 한도의 60%에서 발행을 막는다 (서버 1.8GB 를 나눠 쓰므로)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.6"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    # 기본값은 기존 수동 배포(deploy.sh)가 로컬에 적재한 이미지. CD 는 레지스트리 경로를 넣어 준다.
    image: ${BACKEND_IMAGE:-zipick-backend:latest}
    build: ../zipick-backend
    restart: unless-stopped
    # db 는 외부 서버일 수 있어 의존성에 넣지 않는다. 로컬 db 를 쓸 때는 배포 스크립트가 db 를 먼저 띄운다.
    depends_on:
      rabbitmq:
        condition: service_healthy
    # collector 가 같은 값을 물려받는다 (&app-env). 둘이 다른 것은 아래 '프로세스 역할' 세 개뿐이다.
    environment: &app-env
      SPRING_PROFILES_ACTIVE: prod
      # 프로세스 역할: 웹 서버는 요청 처리만 한다. 공고·주변 인프라 수집과 수집 API 는 collector 가 맡는다.
      INFRA_COLLECTION_ENABLED: "false"
      COLLECTOR_API_ENABLED: "false"
      EXTERNAL_PROXY_ENABLED: "false"
      NOTIFICATION_SCHEDULER_ENABLED: "true"
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_NAME: zipick
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}
      NOTIFICATION_BASE_URL: http://notification:8081
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY 필요}
      NOTIFICATION_QUEUE_ENABLED: "true"
      # 가입 이메일 인증. 알림센터 이메일 채널(NOTIFICATION_EMAIL_PROVIDER)이 켜진 뒤 true 로
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      # 알림 문구에 넣는 서비스 주소 + 공고 수집 일일 보고를 받을 운영 슬랙·메일 (비우면 보고 안 보냄)
      APP_URL: ${APP_ORIGIN}
      NOTIFICATION_OPS_SLACK_WEBHOOK_URL: ${NOTIFICATION_OPS_SLACK_WEBHOOK_URL:-}
      NOTIFICATION_OPS_EMAIL: ${NOTIFICATION_OPS_EMAIL:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # 아래 네 개는 Spring 설정 키에 환경 변수로 직접 꽂는다 (저장소의 application-prod.yml 은 건드리지 않음)
      #   cors.allowed-origins / cookie.secure / myhome.api.service-key / kakao.local.rest-api-key
      CORS_ALLOWEDORIGINS: ${APP_ORIGIN:?APP_ORIGIN 필요}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MYHOME_API_SERVICEKEY: ${MYHOME_API_KEY:-}
      KAKAO_LOCAL_RESTAPIKEY: ${KAKAO_REST_API_KEY:-}
      # 카카오 로그인(OAuth). 위 KAKAO_LOCAL_RESTAPIKEY(지도·주소 검색)와 용도가 다르다.
      # 같은 카카오 앱을 쓰면 CLIENTID 는 KAKAO_REST_API_KEY 와 같은 값이다.
      # 비어 있으면 카카오 로그인만 꺼지고(503) 이메일 로그인은 그대로 동작한다.
      KAKAO_OAUTH_CLIENTID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENTSECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      # 카카오 디벨로퍼스에 등록한 Redirect URI 와 문자 단위로 같아야 한다.
      KAKAO_OAUTH_REDIRECTURI: ${APP_ORIGIN}/oauth/kakao/callback
      # AI 맞춤 신청 준비 가이드 (Gemini). 키가 비어 있으면 이 기능만 꺼지고 나머지는 정상 동작한다.
      # 키는 공통(gemini.api.key), 모델·호출 상한은 기능 전용 설정이라 이름이 다르다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APPLICATION_GUIDE_MODEL: ${APPLICATION_GUIDE_MODEL:-}
      APPLICATION_GUIDE_DAILY_CALL_BUDGET: ${APPLICATION_GUIDE_DAILY_CALL_BUDGET:-}

  # 공고 수집기 두 개. 웹 서버와 같은 이미지·설정으로 수집만 한 번 하고 끝나는 별도 프로세스다.
  # 평소엔 뜨지 않는다(profiles). monitoring/collect-notices-observed.sh [basic|ai] 가 run 으로 실행하고,
  # monitoring/run-daily-collection.sh 가 basic → ai 순서로 이어서 부른다 (같은 잠금이라 동시에 돌지 않는다).
  #   collector    : NoticeCollectionApplication — 공고 수집(마이홈·LH·SH·GH·HUG) → 주변 인프라. AI 는 강제로 끔
  #   ai-collector : NoticeAiApplication — 첨부 PDF Gemini 추출·정규화 → 주변 인프라. 오래 걸리고 Gemini 비용이 든다
  # 웹 서버와 메모리를 나눠 쓰므로 각각 상한을 둔다. 스크립트의 -XX:MaxRAMPercentage=40 → 힙은 상한의 40%.
  collector:
    image: ${BACKEND_IMAGE:-zipick-backend:latest}
    profiles: [batch]
    restart: "no"
    mem_limit: 1500m
    environment: &collector-env
      <<: *app-env
      INFRA_COLLECTION_ENABLED: "true"
      COLLECTOR_API_ENABLED: "false"
      # 마감·새 공고 알림은 웹 서버의 스케줄러만 보낸다 (중복 발송 방지)
      NOTIFICATION_SCHEDULER_ENABLED: "false"

  ai-collector:
    image: ${BACKEND_IMAGE:-zipick-backend:latest}
    profiles: [batch]
    restart: "no"
    # PDF 를 메모리에 올려 텍스트를 뽑으므로 기본 수집기보다 넉넉히 둔다 (힙 약 720MB)
    mem_limit: 1800m
    # Gemini 키는 app-env 의 GEMINI_API_KEY 를 쓴다. PDF 추출·정규화는 진입점이 강제로 켠다
    environment: *collector-env
    # Gemini 하루 호출량 기록과 PDF 추출 응답 캐시. 실행마다 컨테이너가 지워져도 남아야
    # 하루 호출 상한이 지켜지고 같은 PDF 를 다시 분석하지 않는다 (없으면 기록 실패로 Gemini 호출을 건너뛴다)
    volumes:
      - gemini-pdf-cache:/app/.gemini-pdf-cache

  notification:
    image: ${NOTIFICATION_IMAGE:-zipick-notification:latest}
    build: ../zipick-notification
    restart: unless-stopped
    # db 는 외부 서버일 수 있어 의존성에 넣지 않는다. 로컬 db 를 쓸 때는 배포 스크립트가 db 를 먼저 띄운다.
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_NAME: zipick_notification
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # 이메일: none | smtp | ses
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-none}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health > /dev/null 2>&1 || curl -sf http://localhost:8081/health > /dev/null"]
      interval: 15s
      timeout: 3s
      retries: 10

  web:
    image: ${WEB_IMAGE:-zipick-web:latest}
    build:
      context: ../zipick-frontend
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  gemini-pdf-cache:
  rabbitmq-data:
  caddy-data:
  caddy-config:
