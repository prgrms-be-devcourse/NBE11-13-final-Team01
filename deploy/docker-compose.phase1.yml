# 1차 CD 전용 구성 — db(PostgreSQL) + backend(Spring Boot) + web(Caddy) 만 띄운다.
#
# 신규 서비스(rabbitmq, notification)는 **정의 자체를 넣지 않는다.** 실수로 `up` 을 쳐도 실행되지 않고,
# 서버 .env 에 알림·큐 변수가 없어도 이 파일은 정상적으로 읽힌다.
# 알림센터 구현이 끝나면 docker-compose.prod.yml 로 전환한다 (2차).
#
# 기존 수동 배포(deploy/deploy.sh)는 docker-compose.prod.yml 을 그대로 쓴다. 이 파일은 CD 전용이다.

# 프로젝트 이름을 고정한다. 어느 경로에서 실행하든 기존 배포와 같은 컨테이너·네트워크·볼륨
# (zipick_db-data, zipick_caddy-data ...)을 가리킨다. 이름이 달라지면 빈 볼륨이 새로 생겨 DB 가 비어 보인다.
name: zipick

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zipick
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 필요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
      TZ: Asia/Seoul
    volumes:
      # 운영 데이터. 기존 볼륨을 그대로 쓴다.
      - db-data:/var/lib/postgresql/data
      # docker-compose.prod.yml 과 달리 ./db 초기화 스크립트를 마운트하지 않는다.
      # 1차 CD 는 운영 DB 스키마를 어떤 경우에도 건드리지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d zipick"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    # CD 가 GHCR 이미지 경로를 넣어 준다. 비우면 기존 수동 배포가 적재한 로컬 이미지를 쓴다.
    image: ${BACKEND_IMAGE:-zipick-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: zipick
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}

      # --- 알림 기능은 1차에서 끈다 (서비스를 띄우지 않으므로) ---
      # false 면 NotificationQueueConfig · NotificationPublisher 가 @ConditionalOnProperty 로
      # 아예 생성되지 않는다. RabbitMQ 연결을 시도하지 않는다.
      NOTIFICATION_QUEUE_ENABLED: "false"
      # 키가 비면 NotificationScheduler.run() 이 client.configured() 검사에서 즉시 return 한다.
      # 알림센터로 HTTP 호출을 보내지 않으므로 경고 로그도 쌓이지 않는다.
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:-}

      # 아래 네 개는 Spring 설정 키에 환경 변수로 직접 꽂는다 (application-prod.yml 은 건드리지 않음)
      #   cors.allowed-origins / cookie.secure / myhome.api.service-key / kakao.local.rest-api-key
      CORS_ALLOWEDORIGINS: ${APP_ORIGIN:?APP_ORIGIN 필요}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MYHOME_API_SERVICEKEY: ${MYHOME_API_KEY:-}
      KAKAO_LOCAL_RESTAPIKEY: ${KAKAO_REST_API_KEY:-}

  web:
    image: ${WEB_IMAGE:-zipick-web:latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
