spring:
  application:
    name: zipick
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 3s
    # 브로커가 "받았다"고 확인해 줄 때까지 기다린다 (발행 확인). 확인이 안 오면 HTTP 로 대신 보낸다
    publisher-confirm-type: simple
  profiles:
    default: local
  task:
    scheduling:
      # 기본값은 1이다. 스레드가 하나면 오래 도는 작업 하나가 다른 스케줄러를 통째로 멈춘다.
      # 주변 인프라 수집은 대상이 밀렸을 때 수십 분 이어질 수 있어, 그동안 알림 스케줄러가 굶는다.
      # 현재 스케줄 작업은 인프라 수집(기동/보정, 일일 cron)과 알림 폴링이며
      # 인프라 쪽 둘은 ReentrantLock 으로 서로 겹치지 않으므로 2면 충분하다.
      pool-size: 2

server:
  port: 8080

# API 응답 시간의 대략적인 분포를 제한된 구간으로 기록한다.
management:
  metrics:
    distribution:
      slo:
        '[http.server.requests]': 100ms,300ms,1s,3s,10s

logging:
  level:
    # 일부 공공기관 PDF의 불완전한 내장 글꼴 메타데이터가 같은 경고를 글자마다 반복한다.
    # 실제 PDF 읽기 실패와 우리 파서의 검증 경고는 그대로 출력한다.
    org.apache.pdfbox.pdmodel.font.PDSimpleFont: error
    org.apache.pdfbox.pdmodel.font.PDType0Font: error
    org.apache.pdfbox.pdmodel.font.PDCIDFontType2: error
    org.apache.fontbox.ttf.PostScriptTable: error
    org.apache.fontbox.ttf.CmapSubtable: error

jwt:
  issuer: zipick
  # Base64로 인코딩된 32바이트 이상 키를 환경 변수로 주입한다. 생성: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  refresh-token-expiration: 7d

cors:
  # 프론트엔드 개발 서버 주소. 배포 시 application-prod.yml에서 재정의한다.
  allowed-origins:
    - http://localhost:5173

cookie:
  # 기본값은 안전한 쪽으로 둔다. 로컬은 HTTP라 application-local.yml에서 false로 내린다.
  secure: true
  same-site: Lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 신청 준비 가이드, 공고 PDF 추출기, 정규화기가 공유하는 Gemini 연결 정보.
# API Key와 Base URL은 공유하고 모델·타임아웃·호출 상한은 각 기능 설정에서 따로 관리한다.
#
# key 는 일부러 여기에 적지 않는다. ${GEMINI_API_KEY:} 로 적어 두면 환경변수가 없을 때
# 빈 문자열로 확정돼 config/application-secret.yml 의 값을 덮어써 버린다.
# 환경변수 GEMINI_API_KEY 는 relaxed binding 으로 gemini.api.key 에 자동으로 들어간다.
gemini:
  api:
    base-url: https://generativelanguage.googleapis.com

zipick:
  collector:
    # POST /api/internal/notices/sync 등록 여부. permitAll 경로라 운영 웹 서버는 false 로 끈다 (수집은 collector 프로세스)
    api-enabled: ${COLLECTOR_API_ENABLED:true}
  external-proxy:
    # GET /api/external/myhome/** (공공 API 원본 조회, 개발용) 등록 여부. permitAll 경로라 운영 웹 서버는 false
    enabled: ${EXTERNAL_PROXY_ENABLED:true}
  auth:
    # 회원가입 이메일 인증 (안서호). 알림센터의 이메일 채널(SES/SMTP)이 켜져 있어야 하므로 로컬 기본값은 끔.
    # 운영은 EMAIL_VERIFICATION_REQUIRED=true. 켜면 가입 전 /api/auth/email-verification/send → confirm 을 거쳐야 한다
    email-verification:
      required: ${EMAIL_VERIFICATION_REQUIRED:false}
      code-ttl: 10m
      token-ttl: 10m          # 코드 확인 뒤 받은 인증 완료 토큰으로 가입할 수 있는 시간
      resend-cooldown: 60s
      max-attempts: 5
      max-sends-per-day: 10
  # 공고 첨부 PDF에서 전체 공급주택 행을 추출하는 3.5 Flash Lite 전용 정책.
  # 신청 가이드와 API Key·Base URL을 공유하되 아래 실행 정책은 독립적으로 적용한다.
  gemini-pdf-parser:
    key: ${gemini.api.key:}
    base-url: ${gemini.api.base-url:https://generativelanguage.googleapis.com}
    enabled: ${GEMINI_PDF_PARSER_ENABLED:true}
    model: ${GEMINI_PDF_PARSER_MODEL:gemini-3.5-flash-lite}
    max-file-bytes: 41943040
    # PDF 한 건씩 처리하므로 모델의 출력 한도를 사용한다.
    max-output-tokens: 65536
    thinking-level: medium
    timeout: 5m
    # 최초에는 공급표 관련 페이지만 호출하고, 누락된 경우에만 해당 행 주변 페이지를 40행 단위로 보정한다.
    daily-call-limit: 500
    # 신규 PDF가 일일 한도를 전부 소진하지 않도록 보정 호출 몫을 남긴다.
    retry-call-reserve: 20
    max-continuation-calls: 4
    # 일반 문서는 최초 1회만 분석한다. 예상 공급행이 이 값 이상인 대형 문서만 누락행을 후속 호출한다.
    continuation-min-expected-units: 50
    # 호출 횟수보다 문서별 완전성을 우선해 PDF 한 건만 한 요청에 전달한다.
    max-documents-per-request: 1
    max-pages-per-request: 120
    # PDF SHA-256과 프롬프트 버전이 같으면 AI를 다시 호출하지 않는다.
    cache-directory: .gemini-pdf-cache
  # Lite 추출 JSON을 DB 구조로 검수하는 3.8 Flash 전용 정책.
  gemini-normalization:
    enabled: ${GEMINI_NORMALIZATION_ENABLED:true}
    # Lite 추출이 모두 끝난 뒤 DB 저장 직전에 3.8 Flash로 JSON만 묶어서 검수한다.
    model: gemini-3.8-flash
    thinking-level: low
    max-output-tokens: 16384
    # 250K TPM을 넘지 않도록 입력은 220K 목표, 235K 절대 상한으로 묶는다.
    target-input-tokens: 220000
    max-input-tokens: 235000
    # 무료 RPD 20 중 정상 배치 18회, 실패 재시도 2회를 예약한다.
    daily-call-limit: 20
    normal-call-limit: 18
    timeout: 5m

  # 공급주택 주변 생활 인프라 (카카오 로컬 카테고리 검색)
  infra:
    # 인프라는 자주 바뀌지 않아 길게 잡는다. 만료되면 배치가 다시 수집한다.
    cache-ttl: 30d
    collection:
      # 운영 웹 서버는 false (수집은 collector 프로세스가 공고 수집 직후 실행). 로컬·collector 는 true
      enabled: ${INFRA_COLLECTION_ENABLED:true}
      # 한 번에 DB에서 가져올 최대 주택 수. 대상이 남아 있으면 대기 없이 다음 batch 를 이어서 처리한다.
      batch-size: 100
      # 카카오 호출이 연속으로 이 횟수만큼 실패하면 남은 batch 가 있어도 실행 전체를 중단한다(전체 장애로 판단).
      # 특정 주택의 응답 데이터 문제는 여기 해당하지 않고 그 주택만 건너뛴다.
      api-failure-threshold: 3
    # 수집 카테고리와 반경. 화면 표시 순서도 이 순서를 따른다.
    # 값을 바꾸면 policy_signature가 달라져 다음 배치에서 전체가 재수집된다.
    # 반경은 추천의 infra-zero-score-m(1500)과 맞춘다. 더 좁게 잡으면 반경 밖 시설이
    # '없음'(0점)으로 떨어져 점수가 불연속이 된다.
    categories:
      - { code: SUBWAY,            kakao-code: SW8, label: 지하철역, radius-m: 1500 }
      - { code: MART,              kakao-code: MT1, label: 대형마트, radius-m: 1500 }
      - { code: CONVENIENCE_STORE, kakao-code: CS2, label: 편의점,   radius-m: 1500 }
      - { code: HOSPITAL,          kakao-code: HP8, label: 병원,     radius-m: 1500 }
      - { code: PHARMACY,          kakao-code: PM9, label: 약국,     radius-m: 1500 }
      - { code: SCHOOL,            kakao-code: SC4, label: 학교,     radius-m: 1500 }

  # AI 맞춤 신청 준비 가이드. 관심 공고의 모집공고문을 읽어 제출서류·확인사항을 정리한다.
  # 이 기능이 Gemini 를 어떻게 쓸지에 대한 정책을 여기에 모은다 (공통 gemini.api 에는 키·주소만 둔다).
  application-guide:
    # 이 기능이 쓸 모델. 우선순위: APPLICATION_GUIDE_MODEL > GEMINI_MODEL > 아래 기본값
    #   APPLICATION_GUIDE_MODEL  이 기능만 다른 모델을 쓰고 싶을 때
    #   GEMINI_MODEL             팀 공통 기본 모델을 한 번에 지정하고 싶을 때 (선택)
    # 같은 Gemini 를 쓰는 다른 기능(공고 수집 보조 PDF 파서)이 모델을 바꿔도
    # 이 기능이 따라 바뀌지 않도록 전용 이름을 먼저 본다.
    model: ${APPLICATION_GUIDE_MODEL:${GEMINI_MODEL:gemini-3.5-flash-lite}}

    connect-timeout: 5s
    # 공고문 수십 쪽을 읽고 JSON 을 만들어 내는 호출이라 넉넉히 둔다.
    # PDF 원본을 통째로 보내는 기능은 이보다 훨씬 길어야 해서 값을 공유하지 않는다
    read-timeout: 90s

    # 비정상 입력을 막는 비상 상한(자). 정상적인 공고를 줄이기 위한 값이 아니다.
    # Reducer 가 "신청 준비와 관련 있다" 고 고른 덩어리는 평상시 전부 보낸다. 토큰을 아끼려고
    # 다시 버리면 제출서류·자격 조건이 누락되고, 그 피해가 토큰 절약보다 크기 때문이다.
    #
    # 실측 자연 포화(= matched 전부 + 앞뒤 1쪽): LH26 21,554 / LH34 36,157 / SH106 25,272 /
    # GH110 24,452 / GH109(108쪽) 92,297. neighbor-pages 가 1 이라 문맥이 문서 전체로 번지지 않아
    # 109 는 상한을 올려도 92,297자에서 멈춘다. 즉 평상시 이 값은 한 번도 걸리지 않는다.
    # 150000 은 확인된 최대치의 약 1.6배이고, 추출 오류·키워드 오탐 같은 이상치에서만 작동한다.
    emergency-max-input-chars: 150000
    # 공고문 후보를 몇 건까지 추릴지. 실제 분석은 그중 점수가 가장 높은 1건만 한다.
    # 보통 공고문 한 파일에 자격·서류·절차가 모두 들어 있어, 여러 파일을 합치면 토큰만 늘고 내용이 겹친다
    max-documents: 1
    # 관련 페이지의 앞뒤 몇 쪽까지 함께 보낼지. 제출서류 표가 쪽을 넘어가는 경우가 많다
    neighbor-pages: 1
    # 추출된 글자가 이보다 적으면 스캔 이미지 문서로 보고 포기한다 (OCR 은 범위 밖)
    min-extracted-chars: 1000

    # 이 기능이 하루에 허용하는 생성 호출 수.
    # 비워 두면 기본 200, 0 을 주면 제한하지 않는다.
    #
    # 기본값을 여기 placeholder 가 아니라 ApplicationGuideProperties 에 둔 이유:
    # docker compose 는 .env 의 빈 값도 환경변수로 그대로 넘기는데, 빈 문자열은 null 로 바인딩돼
    # `:200` 같은 placeholder 기본값을 건너뛴다. 그러면 .env 를 비워 둔 운영 환경만 조용히
    # 무제한이 된다. 기본값을 코드에 두면 로컬·Docker·CD 가 같아진다.
    #
    # ⚠️ Google 의 프로젝트·모델 quota 와는 별개인 기능 자체의 보호장치다.
    #    Gemini 사용량은 Google 프로젝트와 사용 모델 구성에 따라 다른 AI 기능과 공유될 수 있으므로,
    #    운영에서는 함께 쓰는 기능의 호출량을 고려해 조정해야 한다.
    #    (개발 중에는 APPLICATION_GUIDE_DAILY_CALL_BUDGET 로 더 높여 쓸 수 있다)
    daily-call-budget: ${APPLICATION_GUIDE_DAILY_CALL_BUDGET:}

  # 기관별 공고 수집 설정
  sources:
    sh:
      # SH 공고 수집 활성화 여부
      enabled: true
      # 한 번에 조회할 최대 목록 페이지 수
      max-pages: 40
      # 오늘을 기준으로 수집할 과거 공고 기간
      lookback-days: 365
      # SH 서버 부하 방지를 위한 요청 간격(ms)
      request-delay-millis: 100
    gh:
      # GH 임대주택·매입임대 모집공고 수집
      enabled: true
      max-pages: 5
      request-delay-millis: 100
    hug:
      # HUG 든든전세주택 모집공고·공급주택 수집
      enabled: true
      max-pages: 20
      request-delay-millis: 100
  recommendation:
    # 추천 목록 기준 (가정 — 근거 표 참고)
    min-score: 60
    max-results: 30
    max-per-announcement: 5
    min-results-before-relax: 5
    # 지원조건 '확인 필요' 배수 (가정)
    check-multiplier: 0.7
    # 보증금 → 월 환산 이율 = min(10%, 기준금리 + 2%p). 주택임대차보호법 시행령 제9조
    # 한국은행 기준금리(연 %). 2026년 8월 27일 3.0%. 금통위 발표 때 갱신
    base-rate: 3.0
    # 항목별 기본 가중치 (합 100, 가정). 값이 없는 항목은 빼고 남은 가중치로 다시 나눈다
    base-weights:
      cost: 30
      region: 25
      area: 15
      rooms: 10
      infra: 10
      age: 5
      type: 5
    # 점수로 순위를 매기려면 꼭 있어야 하는 항목. 하나라도 없으면 '정보 부족' 묶음으로 따로 보여 준다
    required-items: [cost, region]
    # 사용자가 따로 정하지 않으면 '꼭' 조건으로 보는 항목. 관심 지역 밖 집이 위로 오지 않게 한다(C2 선호 적합성).
    # 사용자가 '되면 좋음'으로 바꾸면 그쪽을 따른다
    default-must-items: [region]
    # 비용: 예산 초과 비율이 이 값 이상이면 0점 (가정)
    cost-over-budget-zero-ratio: 0.3
    # 지역: 관심 지역 순위별 점수 (가정)
    region-scores:
      rank1: 1.0
      rank2: 0.8
      rank3: 0.6
    # 면적: 범위를 이만큼(㎡) 벗어날 때마다 0.25 감점 (가정)
    area-step-m2: 10
    # 최저주거기준 가구원 수별 최소 면적(㎡). 1인은 e-나라지표, 2인 이상은 2011년 개정안 보도 기준 (고시 원문 확인 필요)
    minimum-area-by-household:
      1: 14
      2: 26
      3: 36
      4: 43
      5: 46
      6: 55
    # 방 수: 희망보다 1개 적을 때마다 감점 (가정)
    room-step-penalty: 0.5
    # 인프라: 만점 거리(m)는 서울 청년안심주택 역세권 350m, 0점 거리는 가정
    infra-full-score-m: 350
    infra-zero-score-m: 1500
    # 노후도: 준공 후 이 연수가 되면 0점 (가정)
    age-zero-years: 30
    # 2026년 적용 도시근로자 가구원 수별 월평균소득 100% (원). 마이홈 국민임대 입주자격 안내
    urban-worker-income:
      1: 4576036
      2: 6452897
      3: 8168429
      4: 8802202
      5: 9326985
      6: 9906263
      7: 10485541
    # 공공임대 유형별 지원조건 (2026년 적용, 금액 만 원). 최종 자격은 공고문 기준
    eligibility:
      # 행복주택(청년): 만 19~39세 미혼, 무주택, 소득 100%(1인 +20%p, 2인 +10%p), 총자산 2억 5,100만, 자동차 4,542만.
      # 기혼이면 신혼부부 계층(혼인 7년 이내 또는 6세 이하 자녀, 맞벌이 120%, 총자산 3억 4,500만)일 수 있어 '확인 필요'
      HAPPY:
        min-age: 19
        max-age: 39
        requires-homeless: true
        requires-single: true
        married-note: "신혼부부 계층(혼인 7년 이내 또는 만 6세 이하 자녀) 해당 여부는 공고문 확인 필요"
        income-percent: {"1": 120, "2": 110, "default": 100}
        max-total-assets: 25100
        max-car-value: 4542
      # 국민임대: 무주택 세대구성원, 소득 70%(1인 90%, 2인 80%), 총자산 3억 4,500만, 자동차 4,542만
      NATIONAL:
        requires-homeless: true
        income-percent: {"1": 90, "2": 80, "default": 70}
        max-total-assets: 34500
        max-car-value: 4542
      # 청년 매입임대: 미혼, 만 19~39세 '또는' 대학생·취업준비생. 3순위 = 본인 소득 1인 100%, 행복주택(청년) 자산 기준.
      # 넘더라도 2순위(본인+부모 소득, 국민임대 자산 3억 4,500만)일 수 있어 '확인 필요'
      YOUTH_PURCHASE:
        min-age: 19
        max-age: 39
        requires-single: true
        student-extends-age: true
        requires-homeless: true
        income-percent: {"default": 100}
        income-household-size: 1
        max-total-assets: 25100
        max-car-value: 4542
        fallback:
          max-total-assets: 34500
          note: "부모 소득을 합산하는 2순위로 신청할 수 있는지 공고문 확인 필요"
      PURCHASE:
        note: "매입임대는 대상(일반·신혼·청년 등)마다 조건이 달라 공고문 확인 필요"
      DEUNDEUN:
        requires-homeless: true
      PERMANENT:
        note: "영구임대는 수급자·차상위 등 대상이 따로 있어 공고문 확인 필요"
      INTEGRATED:
        note: "통합공공임대 지원조건은 공고문 확인 필요"
      PUBLIC:
        note: "공공임대(5·10년) 지원조건은 공고문 확인 필요"
      JEONSE_LEASE:
        note: "전세임대는 주택을 직접 구하는 방식이라 공고문 확인 필요"

  # 알림 (안서호): 보내는 일은 알림센터(zipick-notification)가 한다. 여기서는 마감·새 공고를 찾아 알림센터에 요청만 적는다.
  notification:
    base-url: ${NOTIFICATION_BASE_URL:http://localhost:8081}
    # 알림센터와 공유하는 키. 비어 있으면 알림 기능이 꺼진다(설정 화면은 503, 스케줄러는 건너뜀)
    internal-key: ${NOTIFICATION_INTERNAL_KEY:}
    # 알림 요청(마감·새 공고·인증 메일)을 큐로 던질지. 알림센터가 꺼져 있어도 요청이 브로커에 남는다.
    # 큐에 못 넣으면(브로커 장애) HTTP 로 한 번 더 시도한다.
    queue-enabled: ${NOTIFICATION_QUEUE_ENABLED:false}
    poll-interval: PT5M
    # 마감·새 공고 알림 스케줄러. collector 프로세스는 false 로 띄워 웹 서버와 중복 발송하지 않는다
    scheduler-enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
    # 알림 문구에 넣는 서비스 주소 (소식 메일의 수신 거부 안내)
    app-url: ${APP_URL:http://localhost:5173}
    # 공고 수집 일일 보고를 받을 곳. 둘 다 비우면 보고를 보내지 않는다
    ops-slack-webhook-url: ${NOTIFICATION_OPS_SLACK_WEBHOOK_URL:}
    ops-email: ${NOTIFICATION_OPS_EMAIL:}
