spring:
  application:
    name: zipick
  profiles:
    default: local
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

jwt:
  issuer: zipick
  # Base64로 인코딩된 32바이트 이상 키를 환경 변수로 주입한다. 생성: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  refresh-token-expiration: 7d

cors:
  # 프론트엔드 개발 서버 주소. 배포 시 application-prod.yml에서 재정의한다.
  allowed-origins:
    - http://localhost:5173

cookie:
  # 기본값은 안전한 쪽으로 둔다. 로컬은 HTTP라 application-local.yml에서 false로 내린다.
  secure: true
  same-site: Lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

zipick:
  # 공급주택 주변 생활 인프라 (카카오 로컬 카테고리 검색)
  infra:
    # 인프라는 자주 바뀌지 않아 길게 잡는다. 만료되면 배치가 다시 수집한다.
    cache-ttl: 30d
    collection:
      enabled: true
      # 이전 실행이 끝난 뒤부터 센다(fixedDelay). 300000ms = 5분
      interval-ms: 300000
      # 기동 후 첫 실행까지. 빈 DB를 빨리 채우도록 짧게 둔다. 10000ms = 10초
      initial-delay-ms: 10000
      # 한 회차에 처리할 최대 주택 수. 현재 대상(모집 중 + 좌표 보유)은 한 회차에 모두 들어간다.
      batch-size: 100
      # 카카오 호출이 연속으로 이 횟수만큼 실패하면 회차를 중단한다(전체 장애로 판단).
      # 특정 주택의 응답 데이터 문제는 여기 해당하지 않고 그 주택만 건너뛴다.
      api-failure-threshold: 3
    # 수집 카테고리와 반경. 화면 표시 순서도 이 순서를 따른다.
    # 값을 바꾸면 policy_signature가 달라져 다음 배치에서 전체가 재수집된다.
    categories:
      - { code: SUBWAY,            kakao-code: SW8, label: 지하철역, radius-m: 1500 }
      - { code: MART,              kakao-code: MT1, label: 대형마트, radius-m: 1000 }
      - { code: CONVENIENCE_STORE, kakao-code: CS2, label: 편의점,   radius-m: 1000 }
      - { code: HOSPITAL,          kakao-code: HP8, label: 병원,     radius-m: 1000 }
      - { code: PHARMACY,          kakao-code: PM9, label: 약국,     radius-m: 1000 }
      - { code: SCHOOL,            kakao-code: SC4, label: 학교,     radius-m: 1000 }

  recommendation:
    # 추천 목록 기준 (가정 — 근거 표 참고)
    min-score: 60
    max-results: 30
    max-per-announcement: 5
    min-results-before-relax: 5
    # 지원조건 '확인 필요' 배수 (가정)
    check-multiplier: 0.7
    # 보증금 → 월 환산 이율 = min(10%, 기준금리 + 2%p). 주택임대차보호법 시행령 제9조
    # 한국은행 기준금리(연 %). 2026년 8월 27일 3.0%. 금통위 발표 때 갱신
    base-rate: 3.0
    # 항목별 기본 가중치 (합 100, 가정). 값이 없는 항목은 빼고 남은 가중치로 다시 나눈다
    base-weights:
      cost: 30
      region: 25
      area: 15
      rooms: 10
      infra: 10
      age: 5
      type: 5
    # 점수로 순위를 매기려면 꼭 있어야 하는 항목. 하나라도 없으면 '정보 부족' 묶음으로 따로 보여 준다
    required-items: [cost, region]
    # 사용자가 따로 정하지 않으면 '꼭' 조건으로 보는 항목. 관심 지역 밖 집이 위로 오지 않게 한다(C2 선호 적합성).
    # 사용자가 '되면 좋음'으로 바꾸면 그쪽을 따른다
    default-must-items: [region]
    # 비용: 예산 초과 비율이 이 값 이상이면 0점 (가정)
    cost-over-budget-zero-ratio: 0.3
    # 지역: 관심 지역 순위별 점수 (가정)
    region-scores:
      rank1: 1.0
      rank2: 0.8
      rank3: 0.6
    # 면적: 범위를 이만큼(㎡) 벗어날 때마다 0.25 감점 (가정)
    area-step-m2: 10
    # 최저주거기준 가구원 수별 최소 면적(㎡). 1인은 e-나라지표, 2인 이상은 2011년 개정안 보도 기준 (고시 원문 확인 필요)
    minimum-area-by-household:
      1: 14
      2: 26
      3: 36
      4: 43
      5: 46
      6: 55
    # 방 수: 희망보다 1개 적을 때마다 감점 (가정)
    room-step-penalty: 0.5
    # 인프라: 만점 거리(m)는 서울 청년안심주택 역세권 350m, 0점 거리는 가정
    infra-full-score-m: 350
    infra-zero-score-m: 1500
    # 노후도: 준공 후 이 연수가 되면 0점 (가정)
    age-zero-years: 30
    # 2026년 적용 도시근로자 가구원 수별 월평균소득 100% (원). 마이홈 국민임대 입주자격 안내
    urban-worker-income:
      1: 4576036
      2: 6452897
      3: 8168429
      4: 8802202
      5: 9326985
      6: 9906263
      7: 10485541
    # 공공임대 유형별 지원조건 (2026년 적용, 금액 만 원). 최종 자격은 공고문 기준
    eligibility:
      # 행복주택(청년): 만 19~39세 미혼, 무주택, 소득 100%(1인 +20%p, 2인 +10%p), 총자산 2억 5,100만, 자동차 4,542만.
      # 기혼이면 신혼부부 계층(혼인 7년 이내 또는 6세 이하 자녀, 맞벌이 120%, 총자산 3억 4,500만)일 수 있어 '확인 필요'
      HAPPY:
        min-age: 19
        max-age: 39
        requires-homeless: true
        requires-single: true
        married-note: "신혼부부 계층(혼인 7년 이내 또는 만 6세 이하 자녀) 해당 여부는 공고문 확인 필요"
        income-percent: {"1": 120, "2": 110, "default": 100}
        max-total-assets: 25100
        max-car-value: 4542
      # 국민임대: 무주택 세대구성원, 소득 70%(1인 90%, 2인 80%), 총자산 3억 4,500만, 자동차 4,542만
      NATIONAL:
        requires-homeless: true
        income-percent: {"1": 90, "2": 80, "default": 70}
        max-total-assets: 34500
        max-car-value: 4542
      # 청년 매입임대: 미혼, 만 19~39세 '또는' 대학생·취업준비생. 3순위 = 본인 소득 1인 100%, 행복주택(청년) 자산 기준.
      # 넘더라도 2순위(본인+부모 소득, 국민임대 자산 3억 4,500만)일 수 있어 '확인 필요'
      YOUTH_PURCHASE:
        min-age: 19
        max-age: 39
        requires-single: true
        student-extends-age: true
        requires-homeless: true
        income-percent: {"default": 100}
        income-household-size: 1
        max-total-assets: 25100
        max-car-value: 4542
        fallback:
          max-total-assets: 34500
          note: "부모 소득을 합산하는 2순위로 신청할 수 있는지 공고문 확인 필요"
      PURCHASE:
        note: "매입임대는 대상(일반·신혼·청년 등)마다 조건이 달라 공고문 확인 필요"
      DEUNDEUN:
        requires-homeless: true
      PERMANENT:
        note: "영구임대는 수급자·차상위 등 대상이 따로 있어 공고문 확인 필요"
      INTEGRATED:
        note: "통합공공임대 지원조건은 공고문 확인 필요"
      PUBLIC:
        note: "공공임대(5·10년) 지원조건은 공고문 확인 필요"
      JEONSE_LEASE:
        note: "전세임대는 주택을 직접 구하는 방식이라 공고문 확인 필요"

  # 알림 (안서호): 아웃박스 + DB 폴링. 채널은 슬랙 웹훅(사용자 설정) / 이메일(아래 spring.mail 이 있을 때만)
  notification:
    poll-interval: PT5M
    max-attempts: 3
    scheduler-enabled: true

# 이메일 채널을 쓰려면 환경 변수로 SMTP 를 넣는다 (없으면 이메일 채널은 꺼지고 슬랙만 동작)
#   MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=... MAIL_PASSWORD=앱비밀번호
