spring:
  application:
    name: zipick
  profiles:
    default: local

server:
  port: 8080

jwt:
  issuer: zipick
  # Base64로 인코딩된 32바이트 이상 키를 환경 변수로 주입한다. 생성: openssl rand -base64 32
  secret: ${JWT_SECRET}
  access-token-expiration: 1h
  refresh-token-expiration: 7d

cors:
  # 프론트엔드 개발 서버 주소. 배포 시 application-prod.yml에서 재정의한다.
  allowed-origins:
    - http://localhost:5173

cookie:
  # 기본값은 안전한 쪽으로 둔다. 로컬은 HTTP라 application-local.yml에서 false로 내린다.
  secure: true
  same-site: Lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

zipick:
  # 공급주택 주변 생활 인프라 (카카오 로컬 카테고리 검색)
  infra:
    # 인프라는 자주 바뀌지 않아 길게 잡는다. 만료되면 배치가 다시 수집한다.
    cache-ttl: 30d
    collection:
      enabled: true
      # 이전 실행이 끝난 뒤부터 센다(fixedDelay). 300000ms = 5분
      interval-ms: 300000
      # 기동 후 첫 실행까지. 빈 DB를 빨리 채우도록 짧게 둔다. 10000ms = 10초
      initial-delay-ms: 10000
      # 한 회차에 처리할 최대 주택 수. 현재 대상(모집 중 + 좌표 보유)은 한 회차에 모두 들어간다.
      batch-size: 100
      # 카카오 호출이 연속으로 이 횟수만큼 실패하면 회차를 중단한다(전체 장애로 판단).
      # 특정 주택의 응답 데이터 문제는 여기 해당하지 않고 그 주택만 건너뛴다.
      api-failure-threshold: 3
    # 수집 카테고리와 반경. 화면 표시 순서도 이 순서를 따른다.
    # 값을 바꾸면 policy_signature가 달라져 다음 배치에서 전체가 재수집된다.
    categories:
      - { code: SUBWAY,            kakao-code: SW8, label: 지하철역, radius-m: 1500 }
      - { code: MART,              kakao-code: MT1, label: 대형마트, radius-m: 1000 }
      - { code: CONVENIENCE_STORE, kakao-code: CS2, label: 편의점,   radius-m: 1000 }
      - { code: HOSPITAL,          kakao-code: HP8, label: 병원,     radius-m: 1000 }
      - { code: PHARMACY,          kakao-code: PM9, label: 약국,     radius-m: 1000 }
      - { code: SCHOOL,            kakao-code: SC4, label: 학교,     radius-m: 1000 }

  recommendation:
    # 추천 목록 기준
    min-score: 60
    max-results: 30
    max-per-announcement: 5
    min-results-before-relax: 5
    # 지원조건 '확인 필요' 배수
    check-multiplier: 0.7
    # 보증금 → 월세 환산 이율 (공고문에 값이 없을 때 기본값, 연 %)
    default-conversion-rate: 6.0
    # 항목별 기본 가중치 (합 100)
    base-weights:
      cost: 35
      region: 25
      area: 15
      infra: 15
      type: 10
    # 비용: 예산 초과 비율이 이 값 이상이면 0점
    cost-over-budget-zero-ratio: 0.3
    # 지역: 관심 지역 순위별 점수
    region-scores:
      rank1: 1.0
      rank2: 0.8
      rank3: 0.6
    # 면적: 범위를 이만큼(㎡) 벗어날 때마다 0.25 감점
    area-step-m2: 10
    # 인프라: 만점 거리(m), 0점 거리(m)
    infra-full-score-m: 500
    infra-zero-score-m: 1500
    # 정보 커버리지: 계산 가능한 항목의 기본 가중치 합이 이 비율 미만이면 '정보 부족'으로 제외
    # (예: 가격·면적이 없으면 35+15=50 → 커버리지 0.5 → 제외)
    min-coverage: 0.6
    # 공공임대 유형별 지원조건 (참고용 근사치, 금액 만 원). 최종 자격은 공고문 기준.
    eligibility:
      PURCHASE:
        min-age: 19
        max-age: 39
        requires-homeless: true
        max-monthly-income: 400
        max-total-assets: 29900
        max-car-value: 3708
        married-bypasses-age: false
      HAPPY:
        min-age: 19
        max-age: 39
        requires-homeless: true
        max-monthly-income: 400
        max-total-assets: 36100
        max-car-value: 3708
        married-bypasses-age: true
      # 국민임대: 연령 제한 없음, 무주택 세대구성원, 소득은 도시근로자 월평균소득 70% 수준(가구원 수별로 다름)
      # 기준값은 참고용 근사치. 실제 공고문 기준으로 확정해야 한다
      NATIONAL:
        requires-homeless: true
        max-monthly-income: 500
        max-total-assets: 34500
        max-car-value: 3708
      DEUNDEUN:
        requires-homeless: true
