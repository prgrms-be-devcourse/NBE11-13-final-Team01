# 로컬 개발용. 접속 정보는 각자 환경 변수로 주입한다.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zipick}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    # 주변 인프라 자동 수집 배치가 SQL을 대량으로 찍어 수집 결과 로그가 묻힌다.
    # 쿼리를 직접 봐야 할 때만 debug로 올린다.
    org.hibernate.SQL: warn

cookie:
  # 로컬은 HTTP이므로 secure를 켜면 쿠키가 전달되지 않는다.
  secure: false
  same-site: Lax
