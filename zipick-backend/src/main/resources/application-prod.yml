spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/zipick?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:zipick}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.zipick: INFO
