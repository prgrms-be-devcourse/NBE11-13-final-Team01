# 운영용. 배포 단계에서 RDS 검토 예정이며 모든 접속 정보는 환경 변수로 주입한다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않는다.
      ddl-auto: validate
    open-in-view: false

# TODO 배포 전 반드시 설정한다. 비워두면 application.yml의 로컬 주소(http://localhost:5173)가 그대로 쓰인다.
#cors:
#  allowed-origins:
#    - https://{배포된 프론트엔드 주소}

cookie:
  # 운영은 HTTPS 전제. 프론트와 백엔드 도메인이 다르면 same-site를 None으로 바꿔야 하며,
  # None은 secure: true 가 반드시 함께 필요하다.
  secure: true
  same-site: Lax
