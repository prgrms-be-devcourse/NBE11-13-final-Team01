# 로컬 DB 접속 정보. 이 파일을 application-secret.yml로 복사해 각자 입력합니다.
zipick:
  local-db:
    username: "YOUR_DB_USERNAME"
    password: "YOUR_DB_PASSWORD"

myhome:
  api:
    service-key: "YOUR_DATA_GO_KR_DECODING_KEY"

kakao:
  local:
    rest-api-key: "YOUR_KAKAO_REST_API_KEY"
  # 카카오 로그인(OAuth 2.0). 위 local(지도·주소 검색)과 용도가 다르다.
  # 같은 카카오 앱을 쓰면 client-id 는 local.rest-api-key 와 같은 값이다.
  # client-secret 은 카카오 디벨로퍼스 > 카카오 로그인 > 보안 에서 발급하고 "사용함"으로 켜야 한다.
  oauth:
    client-id: "YOUR_KAKAO_REST_API_KEY"
    client-secret: "YOUR_KAKAO_CLIENT_SECRET"

# 신청 준비 가이드(3.5), PDF 추출기(3.5), 정규화기(3.8)가 공유하는 Gemini API 키.
# 기능별 모델·타임아웃·호출 상한은 application.yml의 각 namespace에서 따로 관리한다.
gemini:
  api:
    key: "YOUR_SHARED_GEMINI_API_KEY"
