myhome:
  api:
    service-key: "YOUR_DATA_GO_KR_DECODING_KEY"

kakao:
  local:
    rest-api-key: "YOUR_KAKAO_REST_API_KEY"

# Google Gemini API 공통 인증 키.
# 환경변수 GEMINI_API_KEY 를 쓰면 이 항목은 비워 둬도 된다 (환경변수가 우선).
# 기능별 모델·타임아웃·호출 상한은 비밀 값이 아니므로 application.yml 에서 관리한다.
gemini:
  api:
    key: "YOUR_GEMINI_API_KEY"
